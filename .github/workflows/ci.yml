name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" |
            sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  validate:
    name: Validate, test, and package
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report the toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check Swift formatting
        run: |
          swift format lint --recursive --parallel --strict \
            Sources Tests Package.swift

      - name: Validate metadata and shell syntax
        run: |
          plutil -lint Packaging/Info.plist
          zsh -n \
            scripts/notarize_release.sh \
            scripts/package_app.sh \
            scripts/sync_brand_assets.sh \
            scripts/verify_brand_assets.sh \
            scripts/verify_release.sh
          ./scripts/verify_brand_assets.sh

      - name: Run the test suite
        run: swift test --disable-sandbox

      - name: Build and verify an ad-hoc signed DMG
        run: |
          ./scripts/package_app.sh
          ./scripts/verify_release.sh
