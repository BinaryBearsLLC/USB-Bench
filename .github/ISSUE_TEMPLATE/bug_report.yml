name: Bug report
description: Report a reproducible problem in USB Bench
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve USB Bench. Do not include credentials,
        private filenames, or sensitive device data.
  - type: input
    id: version
    attributes:
      label: USB Bench version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: "macOS 15.5, MacBook Pro M3 Pro"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Describe the drive, cable, enclosure, hub, port, and filesystem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open New test
        2. Select ...
        3. Start ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private data and credentials from this report.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
